<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2312233A'/%3E%3Cpath d='M8 20c0-5 3.6-9 8-9s8 4 8 9' stroke='%23C99433' stroke-width='2.4' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='21' r='2.2' fill='%23C99433'/%3E%3C/svg%3E">
<title>桑榆智援 · 老人端</title>
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/elder.css">
</head>
<body class="elder">

<!-- ================= 顶栏 ================= -->
<header class="el-top">
  <div class="left">
    <div class="brand-mark">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M3.5 15.2c0-5.1 3.8-9.2 8.5-9.2s8.5 4.1 8.5 9.2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        <path d="M7.6 15.2c0-2.7 1.9-4.8 4.4-4.8s4.4 2.1 4.4 4.8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" opacity=".55"/>
        <circle cx="12" cy="16.8" r="1.9" fill="currentColor"/>
      </svg>
    </div>
    <div>
      <div class="brand-name">桑榆智援</div>
      <div class="brand-sub">老人端</div>
    </div>
  </div>

  <div class="acts">
    <div class="el-who">
      <div class="ava" id="whoAva">王</div>
      <div>
        <div class="nm" id="whoName">王秀兰</div>
        <div class="ad" id="whoAddr">2号楼 1单元302</div>
      </div>
    </div>
    <button class="icon-btn" id="btnSpeakToggle" title="语音播报开关" aria-label="语音播报开关">
      <svg viewBox="0 0 24 24" fill="none"><path d="M4 9.6h3.2L12 5.4v13.2L7.2 14.4H4V9.6Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M15.6 9a4.2 4.2 0 0 1 0 6M18.2 6.4a7.8 7.8 0 0 1 0 11.2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
    </button>
    <button class="icon-btn" id="btnSettings" title="设置" aria-label="设置">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3.1" stroke="currentColor" stroke-width="1.7"/><path d="M12 3.4v2M12 18.6v2M4.8 7.8l1.7 1M17.5 15.2l1.7 1M4.8 16.2l1.7-1M17.5 8.8l1.7-1" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
    </button>
    <button class="icon-btn" id="btnLogout" title="退出登录" aria-label="退出登录">
      <svg viewBox="0 0 24 24" fill="none"><path d="M14.6 7.8V5.6A1.6 1.6 0 0 0 13 4H6.2A1.6 1.6 0 0 0 4.6 5.6v12.8A1.6 1.6 0 0 0 6.2 20H13a1.6 1.6 0 0 0 1.6-1.6v-2.2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M9.8 12h10.4M17.2 8.8L20.4 12l-3.2 3.2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>
</header>

<!-- ================= 主体 ================= -->
<main class="el-stage">

  <div class="el-main">

    <!-- 问候 -->
    <div class="greet reveal">
      <div class="hi" id="greetHi">王奶奶，上午好</div>
      <div class="sub">
        <span id="greetDate">11 月 2 日 星期一</span>
        <span class="sep"></span>
        <span id="greetWeather">今天降温，出门记得加件衣裳</span>
      </div>
    </div>

    <!-- 语音主卡 -->
    <section class="voice-card reveal" id="voiceCard" data-stage="idle" style="--d:1">

      <header class="vc-head">
        <div>
          <div class="t">有事，跟我说一声</div>
          <div class="d">说完松手，我帮您报给社区</div>
        </div>
        <span class="tag tag--amber" id="asrModeTag">原型演示</span>
      </header>

      <div class="mic-stage">
        <div class="mic-wrap">
          <div class="mic-ring"></div>
          <div class="mic-ring"></div>
          <div class="mic-ring"></div>
          <div class="mic-halo"></div>
          <button class="mic-btn" id="micBtn" aria-label="点一下开始说话">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M12 3.2a3.3 3.3 0 0 1 3.3 3.3v5.2a3.3 3.3 0 1 1-6.6 0V6.5A3.3 3.3 0 0 1 12 3.2Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
              <path d="M5.4 11.2v.6a6.6 6.6 0 0 0 13.2 0v-.6M12 18.4v2.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
            <span class="lbl">按一下 说话</span>
          </button>
        </div>

        <div class="wave" id="wave" aria-hidden="true"></div>

        <div class="vc-state">
          <div class="s1" id="stateMain">点一下这个圆，就能说话</div>
          <div class="s2" id="stateSub">说清楚是啥事、在哪个屋就行</div>
        </div>

        <div class="live-text" id="liveText"></div>
      </div>

      <!-- 识别确认 -->
      <div class="confirm" id="confirmPanel">
        <div class="confirm-said">
          <div class="lb">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M12 3.4l1.9 5.2 5.2 1.9-5.2 1.9L12 17.6l-1.9-5.2L4.9 10.5l5.2-1.9L12 3.4Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
            我听到的是
          </div>
          <div class="tx" id="saidText" contenteditable="true" spellcheck="false"></div>
          <div style="font-size:12px;color:var(--slate-l);margin-top:6px">如果有听错的地方，您可以直接点这里改</div>
        </div>

        <div class="filled" id="filledBox"></div>

        <div class="confirm-actions">
          <button class="btn btn--ghost" id="retryBtn">不对，我重说</button>
          <button class="btn btn--amber" id="submitTicketBtn">对，就这样报</button>
        </div>
      </div>

      <!-- 提交完成 -->
      <div class="done-panel" id="donePanel">
        <div class="ok-ring">
          <svg viewBox="0 0 24 24" fill="none"><path d="M4.8 12.6l4.6 4.6L19.4 7.2" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <h3>已经报给社区了</h3>
        <div class="no" id="doneNo">GD—</div>
        <p class="say" id="doneSay"></p>
        <div class="acts">
          <button class="btn btn--ghost" id="btnSpeakAgain">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M4 9.6h3.2L12 5.4v13.2L7.2 14.4H4V9.6Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M15.6 9a4.2 4.2 0 0 1 0 6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
            再听一遍
          </button>
          <button class="btn btn--amber" id="btnGoProgress">看看进度</button>
        </div>
        <div class="speak-hint" id="speakHint">
          <span class="eq"><i></i><i></i><i></i></span>
          <span>正在用语音给您念一遍</span>
        </div>
      </div>

    </section>

    <!-- 次要输入 -->
    <div class="minor-inputs reveal" style="--d:2">
      <button class="minor-btn" id="btnHandwrite">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 20h4.2L19 9.2a2.1 2.1 0 0 0 0-3l-1.2-1.2a2.1 2.1 0 0 0-3 0L4 15.8V20Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M14.4 6.4l3.2 3.2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        手写输入 <small>用笔写也行</small>
      </button>
      <button class="minor-btn" id="btnType">
        <svg viewBox="0 0 24 24" fill="none"><rect x="2.6" y="6.2" width="18.8" height="11.6" rx="2.2" stroke="currentColor" stroke-width="1.7"/><path d="M7.8 14.2h8.4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        打字输入 <small>拼音打字</small>
      </button>
    </div>

    <!-- 我的诉求 -->
    <section class="history-card reveal" style="--d:3">
      <div class="hd">
        <div class="t">我报过的事</div>
        <span class="tag" id="historyCount">0 条</span>
      </div>
      <div id="historyList"></div>
    </section>

  </div>

  <aside class="el-side">

    <!-- 紧急求助 -->
    <section class="sos-card reveal" id="sosCard" data-armed="0" style="--d:1">
      <div class="hd">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M12 4.4l8.4 14.6H3.6L12 4.4Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M12 9.6v4M12 16.4h.01" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
        <span class="t">紧急求助</span>
      </div>
      <p class="d">身体不舒服、摔倒了、或者觉得有危险，就按下面这个大按钮。</p>
      <button class="sos-btn" id="sosBtn">紧 急 求 助</button>
      <div class="sos-confirm">
        <div class="q">确定要紧急求助吗？社区值班的人会马上看到您的住址和身体情况。</div>
        <div class="acts">
          <button class="no" id="sosCancel">我再想想</button>
          <button class="yes" id="sosYes">确定，快来</button>
        </div>
      </div>
      <div class="foot">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M8.2 4.6h-2A1.8 1.8 0 0 0 4.4 6.6c0 7 6 13 13 13a1.8 1.8 0 0 0 2-2v-2l-4-1.6-1.8 2A14.6 14.6 0 0 1 8.2 8.6l2-1.8L8.2 4.6Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
        情况危急也可以直接打 120
      </div>
    </section>

    <!-- 进度 -->
    <section class="progress-card reveal" id="progressCard" style="--d:2">
      <div class="pc-head">
        <div>
          <div class="t">我这件事到哪一步了</div>
          <div class="no" id="pcNo">还没有正在办的事</div>
        </div>
        <button class="icon-btn" id="pcSpeak" title="语音播报进度" aria-label="语音播报进度">
          <svg viewBox="0 0 24 24" fill="none"><path d="M4 9.6h3.2L12 5.4v13.2L7.2 14.4H4V9.6Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M15.6 9a4.2 4.2 0 0 1 0 6M18.2 6.4a7.8 7.8 0 0 1 0 11.2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="steps" id="pcSteps"></div>
      <div class="pc-foot" id="pcFoot"></div>
    </section>

    <!-- 政策 -->
    <section class="policy-card reveal" style="--d:3">
      <div class="hd">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" style="color:var(--amber-d)"><path d="M12 3.6l7 2.6v5.4c0 4.4-2.9 7.4-7 8.8-4.1-1.4-7-4.4-7-8.8V6.2l7-2.6Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M9 12l2.2 2.2L15.4 10" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        <span class="t">您可能能领的</span>
        <span class="tag tag--amber" id="policyCount">0 项</span>
      </div>
      <div id="policyList"></div>
    </section>

  </aside>

</main>

<div class="toast-wrap" id="toastWrap"></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/speech.js"></script>
<script src="assets/js/dify.js"></script>
<script src="assets/js/elder.js"></script>
</body>
</html>
