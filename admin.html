<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2312233A'/%3E%3Cpath d='M8 20c0-5 3.6-9 8-9s8 4 8 9' stroke='%23C99433' stroke-width='2.4' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='21' r='2.2' fill='%23C99433'/%3E%3C/svg%3E">
<title>桑榆智援 · 社区端</title>
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/admin.css">
</head>
<body class="admin">

<div class="adm">

  <!-- ================= 侧栏 ================= -->
  <aside class="side">
    <div class="side-top">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M3.5 15.2c0-5.1 3.8-9.2 8.5-9.2s8.5 4.1 8.5 9.2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
          <path d="M7.6 15.2c0-2.7 1.9-4.8 4.4-4.8s4.4 2.1 4.4 4.8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" opacity=".55"/>
          <circle cx="12" cy="16.8" r="1.9" fill="currentColor"/>
        </svg>
      </div>
      <div>
        <div class="brand-name">桑榆智援</div>
        <div class="brand-sub">社区工作台</div>
      </div>
    </div>

    <div class="side-org">
      <div class="ic">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4.4 20V9.2L12 4.4l7.6 4.8V20" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M9.6 20v-5.4h4.8V20" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
      </div>
      <div class="tx">
        <div class="t">花园路 3 号院社区</div>
        <div class="d">第三网格 · 张桂芳</div>
      </div>
    </div>

    <nav class="nav" id="nav">
      <div class="grp">工作台</div>
      <button class="nav-item on" data-route="dashboard">
        <svg viewBox="0 0 24 24" fill="none"><rect x="3.6" y="3.6" width="7" height="7" rx="1.6" stroke="currentColor" stroke-width="1.7"/><rect x="13.4" y="3.6" width="7" height="7" rx="1.6" stroke="currentColor" stroke-width="1.7"/><rect x="3.6" y="13.4" width="7" height="7" rx="1.6" stroke="currentColor" stroke-width="1.7"/><rect x="13.4" y="13.4" width="7" height="7" rx="1.6" stroke="currentColor" stroke-width="1.7"/></svg>
        <span>总览</span>
      </button>
      <button class="nav-item" data-route="inbox">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 13.6V6.2A1.6 1.6 0 0 1 5.6 4.6h12.8A1.6 1.6 0 0 1 20 6.2v7.4" stroke="currentColor" stroke-width="1.7"/><path d="M4 13.6h4l1.2 2.2h5.6L16 13.6h4v4.2a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-4.2Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
        <span>诉求接收</span>
        <em class="cnt" id="navPending" style="display:none">0</em>
      </button>
      <button class="nav-item" data-route="analytics">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4.4 19.4V4.6M4.4 19.4h15.2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M8 15.4v-4M12.4 15.4V7.6M16.8 15.4v-6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        <span>数据分析</span>
      </button>
      <button class="nav-item" data-route="elders">
        <svg viewBox="0 0 24 24" fill="none"><circle cx="9.2" cy="8.6" r="3.2" stroke="currentColor" stroke-width="1.7"/><path d="M3.2 19.4c0-3.2 2.7-5.4 6-5.4s6 2.2 6 5.4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M16 5.6a3.2 3.2 0 0 1 0 6.2M17.4 14.2c2 .6 3.4 2.2 3.4 4.4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        <span>老人档案</span>
      </button>

      <div class="grp">智能研判</div>
      <button class="nav-item" data-route="insights">
        <svg viewBox="0 0 24 24" fill="none"><path d="M3 12.4h3.6l2.2-5.6 4 11.2 2.4-5.6H21" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>研判预警</span>
        <em class="cnt" id="navAlerts" style="display:none">0</em>
      </button>

      <div class="grp">系统</div>
      <button class="nav-item" data-route="settings">
        <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3.1" stroke="currentColor" stroke-width="1.7"/><path d="M12 3.4v2M12 18.6v2M4.8 7.8l1.7 1M17.5 15.2l1.7 1M4.8 16.2l1.7-1M17.5 8.8l1.7-1" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        <span>设置</span>
      </button>
    </nav>

    <div class="side-foot">
      <div class="side-user">
        <div class="ava" id="sideAva">张</div>
        <div class="tx">
          <div class="n" id="sideName">张桂芳</div>
          <div class="r">网格员 · 第三网格</div>
        </div>
        <button class="out" id="btnLogout" title="退出登录" aria-label="退出登录">
          <svg viewBox="0 0 24 24" fill="none"><path d="M14.6 7.8V5.6A1.6 1.6 0 0 0 13 4H6.2A1.6 1.6 0 0 0 4.6 5.6v12.8A1.6 1.6 0 0 0 6.2 20H13a1.6 1.6 0 0 0 1.6-1.6v-2.2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M9.8 12h10.4M17.2 8.8L20.4 12l-3.2 3.2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>
  </aside>

  <div class="side-mask" id="sideMask" aria-hidden="true"></div>

  <!-- ================= 主区 ================= -->
  <div class="main">
    <header class="topbar">
      <button class="side-toggle" id="btnSide" title="收起 / 展开侧栏" aria-label="收起或展开侧栏" aria-expanded="true">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 6.4h16M4 12h16M4 17.6h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <div class="ttl">
        <h1 id="pageTitle">总览</h1>
        <p id="pageSub">今日社区养老诉求与处置情况</p>
      </div>
      <div class="grow"></div>

      <div class="top-search">
        <svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="6.4" stroke="currentColor" stroke-width="1.7"/><path d="M16 16l4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        <input id="globalSearch" type="search" placeholder="搜老人、工单号、诉求内容" autocomplete="off">
        <span class="kbd">/</span>
      </div>

      <button class="icon-btn" id="btnBell" title="通知" aria-label="通知">
        <svg viewBox="0 0 24 24" fill="none"><path d="M6.4 9.6a5.6 5.6 0 0 1 11.2 0c0 4.1 1.4 5.6 1.4 5.6H5s1.4-1.5 1.4-5.6Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M10 18.4a2.1 2.1 0 0 0 4 0" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        <span class="bell-badge" id="bellCount">0</span>
      </button>
    </header>

    <main class="view" id="view"></main>
  </div>

</div>

<div class="toast-wrap" id="toastWrap"></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/speech.js"></script>
<script src="assets/js/dify.js"></script>
<script src="assets/js/admin.js"></script>
</body>
</html>
